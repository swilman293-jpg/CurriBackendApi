<!DOCTYPE html>
<html>
<body>
    <script src="Js/admin.js"></script>
    <script src="Js/admineditar.js"></script>
    <div class="card my-4">
        <div class="card-body">
            <h4> Agregar Nueva Eduacion</h4>
            <form id="form-educacion">
                <input type="text" id="institucion" placeholder="Institución" required>
                <input type="text" id="titulo" placeholder="Título" required>
                <input type="date" id="inicio" required>
                <input type="date" id="fin" required>
                <button type="submit">Guardar</button>
            </form>
        </div>
    </div>
    <script src="Js/adminex.js"></script>
    <div class="card my-4">
        <div class="card-body">
            <h4> Agregar Nueva Experiencia</h4>
            <form id="form-experiencia_laboral">
                <input type="text" id="experiencia" placeholder="Experiencia" required>
                <input type="text" id="cargo" placeholder="Cargo" required>
                <input type="date" id="ini" required>
                <input type="date" id="f" required>
                <button type="submit">Guardar</button>
            </form>
        </div>
    </div>

    <script src="Js/adminHabi.js"></script>
    <div class="card my-4">
        <div class="card-body">
            <h4> Agregar Nueva Tecnologia</h4>
            <form id="form-tecnologias">
                <input type="text" id="nombre" placeholder="Nombre" required>
                <input type="text" id="nivel" placeholder="Nivel" required>

                <button type="submit">Guardar</button>
            </form>
        </div>
    </div>

    <script src="Js/adminUs.js"></script>
    <div class="card my-4">
        <div class="card-body">
            <h4> Agregar Nuevo Usuario</h4>
            <form id="form-Usuarios">
                <input type="text" id="nomb" placeholder="Nombre" required>
                <input type="text" id="apellido" placeholder="Apellido" required>
                <input type="text" id="titu" placeholder="TituloProfesional" required>
                <input type="text" id="acerca" placeholder="AcercaDe" required>
                <input type="text" id="email" placeholder="Email" required>
                <input type="text" id="telef" placeholder="Telefono" required>
                <input type="text" id="link" placeholder="LinkedinUrl" required>
                <input type="text" id="gith" placeholder="GithubUrl" required>

                <button type="submit">Guardar</button>
            </form>
        </div>
    </div>
    <div class="text-center mt-4">
        <button type="button" id="cargarParaEditar">
            Editar información
        </button>
        <button type="button" id="btnActualizarTodo">
            Actualizar Todo
        </button>
    </div>
</body>
</html>
